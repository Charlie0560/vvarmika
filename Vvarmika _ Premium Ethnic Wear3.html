<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vvarmika | Premium Ethnic Wear</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF6E9;--paper:#FFFFFF;--ink:#3B0F1B;--mute:#7C5A62;--gold:#A5650F;--line:#EBD3C0;--btn:#7A1230;--btnT:#FFF1DC;--hero:#7A1230;--heroT:#FFF1DC;--band:#F2B33D;--pink:#D81B60;--serif:"Cormorant Garamond",Georgia,serif;--sans:Jost,system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--hero:#4A0E1E;--heroT:#FFF1DC;--band:#F0B94B;--pink:#F0508A;--bg:#1E0C13;--paper:#2A121C;--ink:#FBEBD8;--mute:#C9A9AE;--gold:#F0B94B;--line:#4A2230;--btn:#F0B94B;--btnT:#2B0A12}}
:root[data-theme="dark"]{--hero:#4A0E1E;--heroT:#FFF1DC;--band:#F0B94B;--pink:#F0508A;--bg:#1E0C13;--paper:#2A121C;--ink:#FBEBD8;--mute:#C9A9AE;--gold:#F0B94B;--line:#4A2230;--btn:#F0B94B;--btnT:#2B0A12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hero);z-index:10}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.1;margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hero);color:var(--heroT);display:flex;align-items:center;justify-content:space-between;padding:10px 5vw}
.brand{display:flex;align-items:center;gap:12px;font:600 20px var(--serif);letter-spacing:.3em;text-decoration:none;color:var(--heroT)}
.mark{width:46px;height:46px;border-radius:50%;background-size:215%;background-position:50% 27%;flex:none;box-shadow:0 0 0 2px var(--band)}
.nav{display:flex;gap:22px;align-items:center}
.nav a{text-decoration:none;color:var(--heroT);opacity:.75}.nav a:hover,.nav a.on{opacity:1}.nav a.on{border-bottom:2px solid var(--band)}
.wrap{padding:0 5vw;max-width:1180px;margin:0 auto}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:5vw;align-items:center;padding:6vh 0 8vh}
.hero h1{font-size:clamp(46px,8vw,96px);font-weight:500}
.hero p{max-width:30ch;font-size:19px;color:inherit;opacity:.88;margin:18px 0 28px}
.btn{display:inline-block;background:var(--btn);color:var(--btnT);border:0;border-radius:999px;padding:13px 30px;cursor:pointer;text-decoration:none;font-weight:500}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--ink)}
.herob{background:var(--hero);color:var(--heroT)}.hd,.herob,.ft,body::before{transition:background-color .7s}.show{display:flex;flex-direction:column;align-items:center;gap:16px}.show .big{width:min(100%,400px);aspect-ratio:3/4.3}.big img{transition:opacity .25s,transform .7s}.big img.out{opacity:0;transform:scale(1.06)}.thumbs{display:flex;gap:8px}.th{width:46px;aspect-ratio:3/4.2;border-radius:23px 23px 3px 3px;overflow:hidden;border:0;padding:0;cursor:pointer;opacity:.5;transition:.2s;background:none}.th.on,.th:hover{opacity:1;transform:translateY(-4px)}.th img{width:100%;height:100%;object-fit:cover;display:block}.now{margin-top:26px;font-size:18px}.now a{margin-left:10px;color:var(--band)}.mq{overflow:hidden;white-space:nowrap;border-top:1px solid rgba(255,241,220,.25);padding:12px 0;font:italic 500 22px var(--serif)}.mq div{display:inline-block;animation:mq 40s linear infinite}@keyframes mq{to{transform:translateX(-50%)}}.card .arch{position:relative}.card .arch img{transition:transform .5s}.card:hover .arch img{transform:scale(1.07)}.heart{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#7C5A62;cursor:pointer;font-size:18px;transition:transform .2s}.heart:hover{transform:scale(1.15)}.heart.on{color:#D81B60}.qa{position:absolute;left:10px;bottom:10px;border:0;border-radius:999px;padding:8px 14px;background:var(--btn);color:var(--btnT);cursor:pointer;font-size:14px;opacity:0;transform:translateY(8px);transition:.25s}.card:hover .qa,.qa:focus-visible{opacity:1;transform:none}@media(hover:none){.qa{opacity:1;transform:none}}.zm{cursor:zoom-in}.zm img{transition:transform .25s}.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-bottom:6px}.bar i{display:block;height:100%;background:var(--pink);transition:width .4s}@media(prefers-reduced-motion:reduce){.mq div{animation:none}.big img,.card .arch img{transition:none}}.herob .btn{background:var(--band);color:#3B0F1B}.herob .arch{box-shadow:0 0 0 3px var(--band)}.arches{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:12px;align-items:end}
.arch{aspect-ratio:3/4;border-radius:999px 999px 6px 6px;overflow:hidden;background:var(--line)}
.arches .arch:nth-child(2){aspect-ratio:3/4.7}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 35%;display:block}
.trio{display:grid;grid-template-columns:repeat(3,1fr);background:var(--band);color:#3B0F1B;border-radius:18px;margin:44px 0 64px}
.trio div{padding:26px 22px}.trio div+div{border-left:1px solid rgba(59,15,27,.25)}
.trio h3{font-size:26px;margin-bottom:6px}.trio p{margin:0;font-size:15px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 24px}.sec h2{font-size:38px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:30px 22px;margin-bottom:64px}
.card{cursor:pointer}.card h3{font-size:22px;margin:12px 0 2px}.card .pr{color:var(--pink);font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 18px;cursor:pointer}
.chip.on{background:var(--btn);color:var(--btnT);border-color:var(--btn)}
.pd{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:5vw;padding:5vh 0 40px}
.pd h1{font-size:clamp(34px,5vw,54px)}.pd .pr{font-size:26px;color:var(--pink);margin:8px 0 14px}
.lbl{font-weight:500;margin:18px 0 8px}
.rev{border-top:1px solid var(--line);padding:14px 0}.rev b{font-weight:500}.st{color:var(--gold);letter-spacing:2px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px}
input,select,textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:4px 0 12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.line{display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.line .arch{border-radius:40px 40px 4px 4px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;padding:5vh 0 56px}
.sum div{display:flex;justify-content:space-between;padding:5px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}.kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:2px;color:var(--mute)}.kpi b{font:600 32px var(--serif);color:var(--ink)}.up{color:#2F9B67}.dgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin:18px 0}.box h3{font-size:24px}.bars rect{fill:#D81B60;cursor:pointer}.bars rect:hover{fill:var(--band)}.tp{display:grid;grid-template-columns:1fr 1fr 34px;gap:10px;align-items:center;margin:10px 0;font-size:14px}.tp .bar{margin:0}.mix{display:flex;height:14px;border-radius:8px;overflow:hidden}.mix i{display:block}@media(max-width:760px){.dgrid{grid-template-columns:1fr!important}}
.err{color:#B3402E;min-height:24px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}td,th{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
.ft{background:var(--hero);color:var(--heroT);padding:40px 5vw;display:flex;gap:32px;align-items:center;flex-wrap:wrap;justify-content:center}
.ft .mark{width:110px;height:110px}.ft p{margin:2px 0;opacity:.85}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btnT);padding:10px 22px;border-radius:999px;z-index:20}
@media(max-width:760px){.hero,.pd,.two{grid-template-columns:1fr}.trio{grid-template-columns:1fr}.trio div+div{border-left:0;border-top:1px solid var(--line)}.brand{font-size:16px;letter-spacing:.2em}.nav{gap:14px}.mark{width:38px;height:38px}}
</style></head>

function home(){return `<div class="herob"><div class="wrap"><section class="hero"><div><h1>Woven with grace</h1><p>Premium ethnic wear, crafted with elegance and made for every celebration.</p><a class="btn" href="#shop">Shop the collection</a><div class="now" id="now"></div></div><div class="show"><div class="big arch"><img id="bigI" src="${IMG.p1}" alt=""></div><div class="thumbs">${P.map((x,k)=>`<button class="th" aria-label="${x.n}" onclick="pick(${k},1)"><img src="${IMG[x.i]}" alt=""></button>`).join("")}</div></div></section></div><div class="mq"><div>${"Premium Ethnic Wear ✦ Crafted with Elegance ✦ Made for Every Celebration ✦ ".repeat(6)}</div></div></div><div class="wrap"><section class="trio"><div><h3>Premium ethnic wear</h3><p>Kurta sets with a matching dupatta, finished with care.</p></div><div><h3>Crafted with elegance</h3><p>Detail you notice up close: borders, yokes and thread work.</p></div><div><h3>Made for every celebration</h3><p>From festival evenings to wedding-season looks.</p></div></section>
<div class="sec"><h2>New arrivals</h2><a href="#shop">View all</a></div><div class="grid">${P.map(card).join("")}</div>
<div class="sec"><h2>What customers say</h2></div><div style="margin-bottom:64px">${[1,3,5].map(i=>{const r=R[i][0];return `<div class="rev"><span class="st">${stars(r.s)}</span> <b>${esc(r.n)}</b> on ${find(i).n}<br>${esc(r.t)}</div>`}).join("")}</div></div>`}
function shop(){const L=["All","Festive","Wedding","Everyday"];return `<div class="wrap" style="padding-top:5vh"><div class="sec"><h2>Shop</h2></div><div class="chips">${L.map(l=>`<button class="chip ${l==filt?"on":""}" onclick="filt='${l}';render()">${l}</button>`).join("")}</div><div class="grid">${P.filter(x=>filt=="All"||x.o==filt).map(card).join("")}</div></div>`}
function product(id){const x=find(id),rv=R[x.id]||[],a=avg(x.id);return `<div class="wrap"><div class="pd"><div class="arch zm" style="border-radius:999px 999px 8px 8px" onmousemove="zoom(event)" onmouseleave="zoom(event,1)"><img src="${IMG[x.i]}" alt="${x.n}"></div><div><h1>${x.n}</h1><div class="pr">${inr(x.p)}</div><p>${x.d}</p><div class="lbl">Size</div><div class="chips">${["S","M","L","XL","XXL"].map(s=>`<button class="chip ${s==size?"on":""}" onclick="size='${s}';render()">${s}</button>`).join("")}</div><button class="btn" onclick="add(${x.id})">Add to cart</button><div class="lbl" style="margin-top:34px">Reviews ${a?`<span class="st">${stars(Math.round(a))}</span> ${a.toFixed(1)} from ${rv.length}`:""}</div>${rv.length?rv.map(r=>`<div class="rev"><span class="st">${stars(r.s)}</span> <b>${esc(r.n)}</b><br>${esc(r.t)}</div>`).join(""):'<p style="color:var(--mute)">No reviews yet. Be the first to review this set.</p>'}<div class="box" style="margin-top:14px"><b>Write a review</b><div class="row"><div><label>Your name<input id="rn"></label></div><div><label>Rating<select id="rs"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label></div></div><label>Your review<textarea id="rt" rows="3"></textarea></label><button class="btn alt" onclick="review(${x.id})">Post review</button></div></div></div></div>`}
function cartV(){if(!cart.length)return `<div class="wrap" style="padding:8vh 0;text-align:center"><h2>Your cart is empty</h2><p style="color:var(--mute)">Add a kurta set to get started.</p><a class="btn" href="#shop">Browse the shop</a></div>`;
return `<div class="wrap two"><div><h2 style="margin-bottom:10px">Your cart</h2>${cart.map((l,k)=>{const x=find(l.id);return `<div class="line"><div class="arch"><img src="${IMG[x.i]}" alt=""></div><div><b>${x.n}</b><br><span style="color:var(--mute)">Size ${l.s} · ${inr(x.p)}</span><div class="qty"><button onclick="qty(${k},-1)" aria-label="Decrease">−</button> ${l.q} <button onclick="qty(${k},1)" aria-label="Increase">+</button> <a href="#cart" onclick="qty(${k},-99)" style="margin-left:12px">Remove</a></div></div><b>${inr(x.p*l.q)}</b></div>`}).join("")}</div>${totals(true)}</div>`}
function totals(b){return `<div class="box sum" style="align-self:start"><h3 style="margin-bottom:10px">Order summary</h3>${sub()?`<div class="bar"><i style="width:${Math.min(100,sub()/30)}%"></i></div><small>${ship()?"Add "+inr(3000-sub())+" more for free delivery":"You’ve unlocked free delivery"}</small>`:""}<div><span>Subtotal</span><span>${inr(sub())}</span></div><div><span>Delivery</span><span>${ship()?inr(ship()):"Free"}</span></div><div><b>Total</b><b>${inr(sub()+ship())}</b></div>${b?`<a class="btn" style="width:100%;text-align:center;margin-top:12px" href="#checkout">Go to checkout</a>`:""}</div>`}
function checkout(){if(!cart.length){location.hash="cart";return ""}return `<div class="wrap two"><div><h2 style="margin-bottom:14px">Delivery details</h2><div class="row"><label>Full name<input id="cn"></label><label>Phone<input id="cp" inputmode="tel"></label></div><label>Address<textarea id="ca" rows="2"></textarea></label><div class="row"><label>City<input id="cc"></label><label>Pincode<input id="cz" inputmode="numeric"></label></div><div class="lbl">Checkout style (demo)</div><div class="chips"><button class="chip on" id="m1" onclick="mode(1)">Starter: send order on WhatsApp or email</button><button class="chip" id="m2" onclick="mode(2)">Standard: pay online</button></div><div id="pay" style="display:none"><div class="lbl">Payment</div><select id="cm"><option>UPI</option><option>Card or net banking</option><option>Cash on delivery</option></select><p style="color:var(--mute);font-size:14px">Prototype: online payment will be connected through Razorpay in the full build.</p></div><div class="err" id="er">${err}</div><div id="snd"><button class="btn" onclick="send('WhatsApp')">Send order on WhatsApp</button> <button class="btn alt" onclick="send('Email')">Send order by email</button></div><button class="btn" id="po" style="display:none" onclick="place()">Place order</button></div>${totals(false)}</div>`}
function done(){if(!last){location.hash="home";return ""}return `<div class="wrap" style="padding:9vh 0;text-align:center"><h1 style="font-size:52px">Thank you, ${esc(last.c)}</h1><p style="font-size:18px">Your order <b>${last.id}</b> for ${inr(last.t)} is placed.<br>We will confirm delivery on ${esc(last.ph)}.</p><a class="btn" href="#shop">Continue shopping</a></div>`}
function admin(){return `<div class="wrap" style="padding:5vh 0 56px"><h2>Shop dashboard</h2><p style="color:var(--mute)">Sample figures for the demo. Orders and reviews you add in the shop update these numbers.</p>${dash()}<h3 style="margin:22px 0 8px">Orders</h3><div class="tbl"><table><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th></tr>${orders.map((o,k)=>`<tr><td>${o.id}</td><td>${esc(o.c)}</td><td>${inr(o.t)}</td><td>${o.pay}</td><td><select style="margin:0;width:auto" onchange="orders[${k}].st=this.value;render(1)">${["New","Packed","Shipped","Delivered"].map(s=>`<option ${s==o.st?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")}</table></div><h3 style="margin:28px 0 8px">Products</h3><div class="tbl"><table><tr><th>Product</th><th>Occasion</th><th>Price</th><th>Reviews</th></tr>${P.map(x=>`<tr><td>${x.n}</td><td>${x.o}</td><td>${inr(x.p)}</td><td>${(R[x.id]||[]).length}</td></tr>`).join("")}</table></div></div>`}
function add(id){const l=cart.find(l=>l.id==id&&l.s==size);l?l.q++:cart.push({id,s:size,q:1});toast("Added to cart");render(1)}
function qty(k,d){cart[k].q+=d;if(cart[k].q<1)cart.splice(k,1);render(1)}
function review(id){const n=$("#rn").value.trim(),t=$("#rt").value.trim();if(!n||!t){toast("Add your name and review");return}(R[id]=R[id]||[]).push({n,s:+$("#rs").value,t});toast("Review posted");render(1)}
function place(){const g=i=>$(i).value.trim(),c=g("#cn"),ph=g("#cp"),a=g("#ca");if(!c||!ph||!a){err="Enter your name, phone and delivery address to place the order.";$("#er").textContent=err;return}err="";const t=sub()+ship();last={id:"VV"+(1001+orders.length),c,ph,t};orders.unshift({id:last.id,c,t,pay:g("#cm")||$("#cm").value,st:"New",live:1,u:cart.map(l=>({id:l.id,q:l.q}))});cart=[];location.hash="confirmed"}
function render(keep){const h=location.hash.slice(1)||"home",y=scrollY;let v;
if(h.startsWith("product-")&&find(h.slice(8)))v=product(h.slice(8));else v=({home,shop,cart:cartV,checkout,confirmed:done,sent:sentV,admin}[h]||home)();
$("#app").innerHTML=head(h)+v;clearInterval(tm);if(h=="home"){pick(cur);auto()}keep?scrollTo(0,y):scrollTo(0,0)}
$("#flogo").style.backgroundImage=`url(${IMG.logo})`;
addEventListener("hashchange",()=>render());render();
</script></body></html>
